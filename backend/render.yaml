services:
  - type: web
    name: xgoal-api
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xgoal-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://xgoal.vercel.app
      - key: LOG_LEVEL
        value: INFO