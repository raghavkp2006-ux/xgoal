[project]
name = "xgoal-backend"
version = "0.1.0"
description = "La Liga analytics platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0,<3.5",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "httpx>=0.27.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/0001_initial_schema.py" = ["E501"] # Historical schema DDL is kept intact; wrapping migration literals is a separate cleanup.
"jobs/bootstrap_teams_fast.py" = ["E501", "E701", "E722"] # Legacy bootstrap parsing uses compact branches and permissive row handling; refactor separately.
"jobs/ingest_api.py" = ["E402", "E501", "E701", "E702", "E722"] # Legacy ingestion CLI retains path bootstrap and compact parsing/error handling; refactor separately.
"jobs/ingest_direct.py" = ["E402", "E501", "E701", "E702", "E722"] # Legacy ingestion CLI retains path bootstrap and compact parsing/error handling; refactor separately.

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: needs the live database; `pytest -m 'not slow'` deselects these",
]
