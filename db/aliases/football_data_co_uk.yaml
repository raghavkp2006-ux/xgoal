# Team alias mappings: football-data.co.uk raw names → canonical team names.
# Built by hand during Phase 1.2. Every name across all SP1 + SP2 CSVs
# must be mapped here. Unmapped names cause ingestion to fail loudly.
#
# Left column: raw name from CSV (HomeTeam / AwayTeam columns)
# Right column: canonical_name in the `teams` table
#
# NOTE: The entry for "Sociedad" below is deliberately wrong as a trap.
# It should map to "Real Sociedad", not "Real Madrid". This is the exact
# class of error fuzzy matching makes and manual review catches.

