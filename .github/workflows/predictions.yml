name: Prediction writer

# Phase 2.7 — the pre-matchday prediction writer, daily at 06:00 UTC.
#
# GitHub cron is always UTC, so this fires at 06:00 UTC every day: after the
# overnight ingest/reconcile window, before the day's La Liga kick-offs. Each run
# writes one row per upcoming fixture per model version at the current hourly
# as_of cut, so re-runs are additive observations rather than overwrites.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Upcoming horizon in days"
        required: false
        default: "7"
      comp:
        description: "Competition code"
        required: false
        default: "SP1"

concurrency:
  group: prediction-writer
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Write predictions for the upcoming fixtures
        run: |
          python -m jobs.predict_matchday \
            --comp "${{ github.event.inputs.comp || 'SP1' }}" \
            --days "${{ github.event.inputs.days || '7' }}"
